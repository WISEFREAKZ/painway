name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    # Forces GitHub to use an older, highly stable Flutter version matching your project
    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    # Cleans out any old cache artifacts from the previous failed runs
    - name: Clean Project
      working-directory: ./physio_app
      run: flutter clean

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Compiles cleanly without triggering strict SDK 36 validation rules
    - name: Build APK
      working-directory: ./physio_app
      run: flutter build apk --debug --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-android-app
        path: physio_app/build/app/outputs/flutter-apk/app-debug.apk
