name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Pre-generates the required Flutter native build files
    - name: Initialize Flutter Build Files
      working-directory: ./physio_app
      run: flutter build apk --config-only

    # Bypasses the Flutter wrapper entirely to compile using clean, isolated Gradle instructions
    - name: Build Production Release APK
      working-directory: ./physio_app/android
      run: |
        ./gradlew clean --no-daemon
        ./gradlew assembleRelease --no-daemon

    # Grabs the newly created release binary file
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-release-app
        path: physio_app/build/app/outputs/flutter-apk/app-release.apk
