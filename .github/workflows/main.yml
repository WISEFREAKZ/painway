name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Step A: Generates the raw Android files from scratch
    - name: Initialize Flutter Build Files
      working-directory: ./physio_app
      run: flutter build apk --config-only

    # Step B: Safe temporary environment modifications applied directly to the cloud runner
    - name: Apply Automated Code Patches
      working-directory: ./physio_app
      run: |
        # Corrects the CardThemeData typo inside the theme configuration
        sed -i 's/CardThemeData/CardTheme/g' lib/theme.dart
        
        # Safely injects the precise NDK version parameter right into the newly generated build framework
        sed -i '/android {/a \    ndkVersion "25.1.8937393"' android/app/build.gradle
        
        # Appends multiDex and the core library desugaring configurations required for your notification plugins
        cat << 'EOF' >> android/app/build.gradle
        android {
            defaultConfig {
                multiDexEnabled true
            }
            compileOptions {
                coreLibraryDesugaringEnabled true
            }
        }
        dependencies {
            coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
        }
        EOF

    # Step C: Compiles release mode via isolated instructions
    - name: Build Production Release APK
      working-directory: ./physio_app/android
      run: |
        ./gradlew clean --no-daemon
        ./gradlew assembleRelease --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-release-app
        path: physio_app/build/app/outputs/flutter-apk/app-release.apk
