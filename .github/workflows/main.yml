name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Dynamically upgrades compileSdk to 36 and enables multidex/desugaring on the fly
    - name: Patch Build Configurations
      working-directory: ./physio_app/android/app
      run: |
        sed -i 's/compileSdk = .*/compileSdk = 36/g' build.gradle
        sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' build.gradle
        sed -i '/defaultConfig {/a \        multiDexEnabled true' build.gradle
        sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' build.gradle
        sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' build.gradle

    - name: Build APK
      working-directory: ./physio_app
      run: flutter build apk --debug --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-android-app
        path: physio_app/build/app/outputs/flutter-apk/app-debug.apk
