name: Compile Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # This step locates where your Android project actually is hidden
    - name: Find Android Project Directory
      id: locate
      run: |
        DIR=$(find . -name "gradlew" -exec dirname {} \;)
        if [ -z "$DIR" ]; then
          DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
        fi
        if [ -z "$DIR" ]; then DIR="."; fi
        echo "project_dir=$DIR" >> $GITHUB_OUTPUT
        echo "Found project directory at: $DIR"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin', cache: 'gradle'}

    # If gradlew is completely missing, this command creates a fresh wrapper automatically
    - name: Ensure Gradle Wrapper Exists
      working-directory: ${{ steps.locate.outputs.project_dir }}
      run: |
        if [ ! -f ./gradlew ]; then
          gradle wrapper
        fi
        chmod +x ./gradlew

    - name: Compile Debug APK
      working-directory: ${{ steps.locate.outputs.project_dir }}
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        path: |
          ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          ${{ steps.locate.outputs.project_dir }}/build/outputs/apk/debug/*.apk
