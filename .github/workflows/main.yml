name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Clean Project
      working-directory: ./physio_app
      run: flutter clean

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Fixes the code typo and appends ALL required NDK and desugaring blocks safely
    - name: Fix Code Typo and App Configs
      working-directory: ./physio_app
      run: |
        # Corrects CardThemeData to CardTheme inside your theme file
        sed -i 's/CardThemeData/CardTheme/g' lib/theme.dart
        
        # Safely appends the NDK version, multiDex, and desugaring setups to the end of build.gradle
        cat << 'EOF' >> android/app/build.gradle

        // Injected by GitHub Actions pipeline to solve final package constraints
        android {
            ndkVersion "25.1.8937393"
            defaultConfig {
                multiDexEnabled true
            }
            compileOptions {
                coreLibraryDesugaringEnabled true
            }
        }
        dependencies {
            coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
        }
        EOF

    - name: Build APK
      working-directory: ./physio_app
      run: flutter build apk --release --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-android-app
        path: physio_app/build/app/outputs/flutter-apk/app-release.apk
