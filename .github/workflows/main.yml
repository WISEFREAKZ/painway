name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    - name: Initialize Flutter Build Files
      working-directory: ./physio_app
      run: flutter build apk --config-only

    - name: Apply Automated Code Patches
      working-directory: ./physio_app
      run: |
        sed -i 's/CardThemeData/CardTheme/g' lib/theme.dart
        sed -i '/android {/a \    ndkVersion "25.1.8937393"' android/app/build.gradle
        
        cat << 'EOF' >> android/app/build.gradle
        android {
            defaultConfig {
                multiDexEnabled true
            }
            compileOptions {
                coreLibraryDesugaringEnabled true
            }
        }
        dependencies {
            coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
        }
        EOF

    - name: Build Production Release APK
      working-directory: ./physio_app/android
      run: |
        ./gradlew clean --no-daemon
        ./gradlew assembleRelease --no-daemon

    # Corrected destination directory targets for the native gradle output configuration
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-release-app
        path: physio_app/android/app/build/outputs/apk/release/app-release.apk
