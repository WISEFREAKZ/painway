name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    # Completely restores modified build files to a factory-fresh state 
    - name: Reset Residual File Duplications
      working-directory: ./physio_app
      run: |
        flutter clean
        git checkout -- android/app/build.gradle || true
        git checkout -- lib/theme.dart || true

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Safely injects the configurations onto a 100% clean canvas
    - name: Apply Fresh Code Patches
      working-directory: ./physio_app
      run: |
        sed -i 's/CardThemeData/CardTheme/g' lib/theme.dart
        sed -i '/android {/a \    ndkVersion "25.1.8937393"' android/app/build.gradle
        
        cat << 'EOF' >> android/app/build.gradle
        android {
            defaultConfig {
                multiDexEnabled true
            }
            compileOptions {
                coreLibraryDesugaringEnabled true
            }
        }
        dependencies {
            coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
        }
        EOF

    - name: Build APK (Release Mode)
      working-directory: ./physio_app
      run: flutter build apk --release --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-release-app
        path: physio_app/build/app/outputs/flutter-apk/app-release.apk
