name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Forces a 100% clean check out of your repository code every single time
    - uses: actions/checkout@v4
      with:
        clean: true

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: false # Disables caching to prevent directory-watching errors

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Fixes the code typo and appends configurations to a completely fresh file
    - name: Fix Code Typo and App Configs
      working-directory: ./physio_app
      run: |
        sed -i 's/CardThemeData/CardTheme/g' lib/theme.dart
        
        cat << 'EOF' >> android/app/build.gradle

        android {
            ndkVersion "25.1.8937393"
            defaultConfig {
                multiDexEnabled true
            }
            compileOptions {
                coreLibraryDesugaringEnabled true
            }
        }
        dependencies {
            coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
        }
        EOF

    - name: Build APK
      working-directory: ./physio_app
      run: flutter build apk --release --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-release-app
        path: physio_app/build/app/outputs/flutter-apk/app-release.apk
