name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Clean Project
      working-directory: ./physio_app
      run: flutter clean

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Automatically patches the NDK version requirement and fixes the code typo
    - name: Fix Code Typo and NDK Config
      working-directory: ./physio_app
      run: |
        # Injects the missing ndkVersion line into the build config
        sed -i '/android {/a \    ndkVersion "25.1.8937393"' android/app/build.gradle
        
        # Corrects CardThemeData to CardTheme inside your theme file
        sed -i 's/CardThemeData/CardTheme/g' lib/theme.dart

    - name: Build APK
      working-directory: ./physio_app
      run: flutter build apk --debug --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-android-app
        path: physio_app/build/app/outputs/flutter-apk/app-debug.apk
