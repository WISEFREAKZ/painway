name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Directly upgrades the Android Gradle Plugin to 8.9.1 to satisfy the packages
    - name: Patch Build Configurations
      working-directory: ./physio_app/android
      run: |
        # Upgrade AGP version in settings.gradle if it uses the modern plugins block
        if [ -f settings.gradle ]; then
          sed -i 's/id "com.android.application" version .*/id "com.android.application" version "8.9.1"/g' settings.gradle
        fi
        
        # Upgrade AGP version in build.gradle if it uses the older classpath style
        if [ -f build.gradle ]; then
          sed -i 's/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:8.9.1"/g' build.gradle
        fi

        # Safely inject the required desugaring configurations to the app module
        cd app
        sed -i 's/compileSdk = .*/compileSdk = 36/g' build.gradle
        sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' build.gradle
        
        cat << 'EOF' >> build.gradle
        android {
            defaultConfig {
                multiDexEnabled true
            }
            compileOptions {
                coreLibraryDesugaringEnabled true
            }
        }
        dependencies {
            coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
        }
        EOF

    - name: Build APK
      working-directory: ./physio_app
      run: flutter build apk --debug --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-android-app
        path: physio_app/build/app/outputs/flutter-apk/app-debug.apk
