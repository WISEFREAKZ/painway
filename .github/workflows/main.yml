name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Scan Project Screens Directory
      run: |
        echo "=== SCANNING LIB DIRECTORY ==="
        ls -R physio_app/lib

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Pre-Inject Dependencies
      working-directory: ./physio_app
      run: |
        # Safely appends the exact pinned Supabase dependency module to the root manifest config
        echo "  supabase_flutter: 2.6.0" >> pubspec.yaml

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    - name: Apply Automated Code Patches
      working-directory: ./physio_app
      run: |
        sed -i 's/CardThemeData/CardTheme/g' lib/theme.dart
        sed -i 's/theme: appTheme/theme: ThemeData.light()/g' lib/main.dart
        
        cat << 'EOF' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace "com.example.physio_app"
            compileSdk 34
            ndkVersion "25.1.8937393"

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
                coreLibraryDesugaringEnabled true
            }

            kotlinOptions {
                jvmTarget = "17"
            }

            sourceSets {
                main.java.srcDirs += "src/main/kotlin"
            }

            defaultConfig {
                applicationId "com.example.physio_app"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
                multiDexEnabled true
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }

        flutter {
            source '../..'
        }

        dependencies {
            coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
        }
        EOF

    - name: Build APK (Release Mode)
      working-directory: ./physio_app
      run: flutter build apk --release --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-release-app
        path: physio_app/build/app/outputs/flutter-apk/app-release.apk
