name: Compile Flutter Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Set up Flutter (Legacy Compatible)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      working-directory: ./physio_app
      run: flutter pub get

    # Compiles the clean release build bypassing the internal lint file-watching error
    - name: Build APK (Release Mode)
      working-directory: ./physio_app
      run: flutter build apk --release --no-lint --android-skip-build-dependency-validation

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: my-flutter-release-app
        path: physio_app/build/app/outputs/flutter-apk/app-release.apk
