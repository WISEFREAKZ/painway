name: physio_app
description: >
  A free, lightweight physical therapy, mobility, and healthy habit
  Android app. Supabase-backed content, fully local notification engine.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Backend (free tier, read-only content) ---
  supabase_flutter: ^2.5.6

  # --- Local, zero-server-cost notification engine ---
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # --- Local persistence of user preferences (no account needed) ---
  shared_preferences: ^2.2.3

  # --- Misc ---
  cupertino_icons: ^1.0.8
  intl: ^0.19.0 # date/time formatting for reminder pickers

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Add local fallback icons/images here if you bundle any offline assets
  # e.g. a static placeholder GIF/image shown while network media loads.
  # assets:
  #   - assets/images/placeholder.png
