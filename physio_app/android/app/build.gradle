plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

android {
    namespace = "com.example.physio_app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Change this before publishing to the Play Store.
        applicationId = "com.example.physio_app"
        minSdk = 23
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // Signed with the debug key so `flutter run --release` and a
            // one-command `flutter build apk` work out of the box.
            // Replace with your own signing config before publishing.
            signingConfig = signingConfigs.debug

            // Code + resource shrinking. Previously both were false,
            // which (combined with no ABI splitting) is the main reason
            // a release build of an app this small could balloon to
            // hundreds of MB — every architecture's native libraries and
            // every unused class/resource were being shipped untouched.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Strip native debug symbols from the release .so files.
            // Unstripped symbols can add tens of MB per architecture.
            ndk {
                debugSymbolLevel = 'none'
            }
        }
    }

    // Build a separate, much smaller APK per CPU architecture instead of
    // one "fat" APK/bundle containing all four architectures' native
    // code at once. Only affects `flutter build apk`; App Bundles
    // (`flutter build appbundle`) already do this automatically per
    // device at install time via Play Store, which is expected — an
    // .aab file always looks larger on disk than what a user actually
    // downloads, since Play generates the optimized per-device APK from
    // it on the fly.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk false
        }
    }
}

flutter {
    source = "../.."
}
